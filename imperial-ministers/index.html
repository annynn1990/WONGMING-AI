<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黃名帝國 皇室重臣名錄</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IM+Fell+English:ital@0;1&family=Noto+Serif+TC:wght@400;600&display=swap');
:root{--p:#f2eadb;--ink:#302920;--muted:#766957;--red:#6d2227;--gold:#ad8751;--line:#b7a78d}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--ink);font-family:'Noto Serif TC',serif}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:radial-gradient(#665 0.5px,transparent .7px);background-size:6px 6px}.page{max-width:1160px;margin:auto;padding:65px 42px 80px}.gear{position:fixed;right:18px;top:15px;border:0;background:none;color:#756957;font-size:21px;opacity:.45;cursor:pointer}.mast{text-align:center;border-bottom:1px solid var(--line);padding:10px 0 40px}.kicker,.en{font-family:'IM Fell English',serif}.kicker{color:var(--red);letter-spacing:.16em;font-size:13px}.mast h1{font:600 52px 'Cormorant Garamond','Noto Serif TC',serif;letter-spacing:.12em;margin:12px 0}.subtitle{font:italic 18px 'IM Fell English',serif;color:var(--muted)}.intro{max-width:760px;text-align:center;margin:34px auto 55px;line-height:2;color:#554b3e}.level{margin-bottom:52px}.head{display:flex;align-items:end;gap:15px;border-bottom:1px solid #9f8d73;padding-bottom:10px;margin-bottom:20px}.num{font:16px 'IM Fell English',serif;color:var(--red)}.head h2{font-size:24px;margin:0;letter-spacing:.1em}.desc{margin-left:auto;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fbf7ed66;border:1px solid var(--line);padding:22px;min-height:170px;box-shadow:0 5px 14px #49351d1a;cursor:default;position:relative}.editmode .card{cursor:pointer}.card:after{content:'';position:absolute;inset:5px;border:1px solid #9c80501f}.card.special{border-color:var(--gold)}.card.high{border-color:#918578}.card.general{border-color:#aaa08f}.card h3{font:600 27px 'Cormorant Garamond','Noto Serif TC',serif;margin:10px 0 3px}.holder{margin-top:17px;padding-top:9px;border-top:1px dotted #b5a58e}.vacant{color:#938778;font-style:italic}.badge-section{border-top:1px solid var(--line);padding-top:38px}.badge-section h2{text-align:center;font:600 30px 'Cormorant Garamond','Noto Serif TC',serif;letter-spacing:.1em}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.badge{text-align:center}.badge img{width:100%;height:190px;object-fit:contain}.badge p{line-height:1.8;color:#574d40}.about{max-width:820px;margin:55px auto 0;border-block:1px solid var(--line);padding:30px;text-align:center;line-height:2.1}.about b{color:var(--red)}footer{text-align:center;margin-top:45px;color:#817564;font:13px 'IM Fell English',serif;letter-spacing:.12em}.modal{display:none;position:fixed;inset:0;background:#211b15a8;z-index:5;align-items:center;justify-content:center;padding:20px}.box{width:min(550px,95vw);background:#f4eddf;border:1px solid #a58e6d;padding:28px;box-shadow:0 20px 50px #0005}.box h2{font:600 28px 'Cormorant Garamond',serif;margin:0 0 18px}.box label{display:block;font-size:13px;margin:10px 0 5px;color:#625747}.box input,.box textarea,.box select{width:100%;padding:9px;border:1px solid #b8a98f;background:#fffaf0;font:inherit}.box textarea{min-height:65px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn{border:1px solid #907653;background:#f7efe1;padding:8px 14px;font:inherit;cursor:pointer}.primary{background:var(--red);color:#fff;border-color:var(--red)}.danger{background:#6d2227;color:#fff;border-color:#6d2227}.add{display:none;margin-left:auto}.editmode .add{display:inline-block}@media(max-width:780px){.page{padding:45px 18px}.grid,.badges{grid-template-columns:1fr}.mast h1{font-size:40px}.head{display:block}.desc{display:block;margin-top:7px}}
</style></head><body>
<button class="gear" onclick="login()">✦</button><div class="page"><header class="mast"><div class="kicker">WONGMING EMPIRE · COURT REGISTER</div><h1>黃名帝國 皇室重臣名錄</h1><div class="subtitle">Imperial Register of Royal Ministers</div></header>
<p class="intro">皇室重臣為帝國的榮譽職銜，並無實際職權，但擁有極高的榮譽地位。共設三個級別，並有相應的級別勳章。</p><main id="levels"></main>
<section class="badge-section"><h2>皇室重臣勳章</h2><div class="badges" id="badges"></div></section>
<section class="about"><b>制度編制</b><br>特級皇室重臣：宮廷大臣、掌璽大臣、典禮大臣，各一名，總額三名。<br>高級皇室重臣：參謀大臣、戰爭大臣、陸軍大臣、海軍大臣、情報大臣，各一名，總額五名。<br>一般皇室重臣：御前大臣，總額七名。</section><footer>黃名帝國 · 皇室重臣名錄</footer></div>
<div class="modal" id="login"><div class="box"><h2>進入編輯模式</h2><label>管理密碼</label><input id="pw" type="password"><div class="actions"><button class="btn" onclick="closeM('login')">取消</button><button class="btn primary" onclick="auth()">進入</button></div></div></div>
<div class="modal" id="editor"><div class="box"><h2>編輯皇室重臣</h2><label>職銜／爵號</label><input id="ft"><label>英文名稱</label><input id="fe"><label>級別</label><select id="fl"><option value="special">特級皇室重臣</option><option value="high">高級皇室重臣</option><option value="general">一般皇室重臣</option></select><label>獲頭銜人</label><input id="fh"><label>備註</label><textarea id="fn"></textarea><div class="actions"><button class="btn danger" onclick="del()">刪除</button><button class="btn" onclick="closeM('editor')">取消</button><button class="btn primary" onclick="save()">儲存變更</button></div></div></div>
<script>
const D=[
["宮廷大臣","Minister of the Court","special","李迎希"],["掌璽大臣","Lord Keeper of the Seal","special","仲尼"],["典禮大臣","Minister of Ceremonies","special",""],
["參謀大臣","Chief of the General Staff","high","夏侯昜"],["戰爭大臣","Minister of War","high","李君羨"],["陸軍大臣","Minister of the Army","high","白敖"],["海軍大臣","Minister of the Navy","high",""],["情報大臣","Minister of Intelligence","high",""],
["御前大臣","Minister of the Privy","general",""],["御前大臣","Minister of the Privy","general",""],["御前大臣","Minister of the Privy","general",""],["御前大臣","Minister of the Privy","general",""],["御前大臣","Minister of the Privy","general",""],["御前大臣","Minister of the Privy","general",""],["御前大臣","Minister of the Privy","general",""]];
const B=[
["https://www.wongmingempire.com/bbswm/data/attachment/forum/202507/27/032817cpwc6zbcbbrruvwu.png","一等皇室重臣勳章","特級皇室重臣佩戴。"],
["https://www.wongmingempire.com/bbswm/data/attachment/forum/202507/27/032817rjjv1cj614emq140.png","二等皇室重臣勳章","高級皇室重臣佩戴。"],
["https://www.wongmingempire.com/bbswm/data/attachment/forum/202507/27/032817ws8o44osb40o3u2u.png","三等皇室重臣勳章","御前大臣佩戴。"]];
let data=JSON.parse(localStorage.getItem("wm_ministers")||"null")||D.map(x=>({t:x[0],e:x[1],l:x[2],h:x[3],n:""})),cur=-1,edit=false;
function esc(s){return String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function render(){let G=[["special","特級皇室重臣","總額三名"],["high","高級皇室重臣","總額五名"],["general","一般皇室重臣","總額七名"]];levels.innerHTML=G.map((g,z)=>'<section class="level"><div class="head"><span class="num">0'+(z+1)+'</span><h2>'+g[1]+'</h2><span class="desc">'+g[2]+'</span><button class="btn add" onclick="addItem(\''+g[0]+'\')">＋新增職銜</button></div><div class="grid">'+data.map((x,i)=>x.l===g[0]?'<article class="card '+x.l+'" onclick="openEdit('+i+')"><div class="en">ROYAL MINISTER</div><h3>'+esc(x.t)+'</h3><div class="en">'+esc(x.e)+'</div><div class="holder">'+(x.h?'<b>'+esc(x.h)+'</b>':'<span class="vacant">目前從缺 · Vacant</span>')+'</div></article>':'').join('')+'</div></section>').join('');badges.innerHTML=B.map(x=>'<article class="badge"><img src="'+x[0]+'"><p><b>'+esc(x[1])+'</b><br>'+esc(x[2])+'</p></article>').join('')}
function login(){document.getElementById("login").style.display="flex";pw.value="";pw.focus()}function auth(){if(pw.value==="1111"||pw.value==="9999"){edit=true;document.body.classList.add("editmode");closeM("login");render()}else pw.value=""}function closeM(id){document.getElementById(id).style.display="none"}function openEdit(i){if(!edit)return;cur=i;let x=data[i];ft.value=x.t;fe.value=x.e;fl.value=x.l;fh.value=x.h;fn.value=x.n;editor.style.display="flex"}function save(){let x=data[cur];x.t=ft.value.trim();x.e=fe.value.trim();x.l=fl.value;x.h=fh.value.trim();x.n=fn.value.trim();persist();closeM("editor");render()}function del(){if(cur<0||!confirm("確定刪除此職銜？"))return;data.splice(cur,1);persist();closeM("editor");render()}function addItem(l){data.push({t:"新增皇室重臣職銜",e:"New Royal Minister",l:l,h:"",n:""});persist();render();openEdit(data.length-1)}function persist(){localStorage.setItem("wm_ministers",JSON.stringify(data))}render();
</script></body></html>
