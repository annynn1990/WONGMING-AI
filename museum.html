<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黃名歷史博物館｜Wongming Museum of History</title>
<style>
:root{--ink:#eee7d5;--muted:#9ea4aa;--gold:#cfb16b;--glass:#11161bd4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d;color:var(--ink);font-family:Inter,"Noto Sans TC","Noto Serif TC",sans-serif}
canvas{display:block;touch-action:none;cursor:crosshair}
#brand{position:fixed;z-index:20;top:24px;left:28px;text-shadow:0 4px 25px #000;pointer-events:none}
#brand h1{margin:0;font:600 29px/1 "Noto Serif TC",serif;letter-spacing:.15em}
#brand p{margin:8px 0 0;font-size:10px;letter-spacing:.18em;color:#bdc1c5;text-transform:uppercase}
#panel{position:fixed;z-index:20;top:22px;right:24px;width:292px;padding:17px 17px 16px;background:linear-gradient(180deg,#10151be8,#080b0fd7);border:1px solid #fff2;box-shadow:0 18px 60px #0008;backdrop-filter:blur(18px)}
.kicker{font-size:9px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}.title{margin:7px 0 6px;font-size:18px}.copy{margin:0;color:#b8bdc3;font-size:12px;line-height:1.75}
#enter,#timeBtn{width:100%;height:39px;border:1px solid #bf9c57;background:#17191a;color:#eadbad;cursor:pointer;letter-spacing:.14em;font-size:11px}
#enter{margin-top:13px}
#timeBtn{margin-top:8px;border-color:#fff3c6;color:#d8d4c8;background:#101318}
#hint{position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#090c10cf;border:1px solid #fff2;color:#acb3ba;font-size:11px;white-space:nowrap;backdrop-filter:blur(13px)}
#reticle{position:fixed;z-index:20;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border:1px solid #eedba7;border-radius:50%;pointer-events:none}
#info{position:fixed;z-index:21;left:50%;bottom:70px;transform:translateX(-50%);display:none;max-width:min(560px,88vw);padding:13px 18px;background:#080b10ee;border:1px solid #fff2;color:#c9ccd1;font-size:12px;line-height:1.75;box-shadow:0 18px 50px #0009}
#info strong{color:#e5d19b}
@media(max-width:700px){#panel{right:10px;top:10px;width:225px}#brand{left:12px;top:12px}#hint{display:none}}
</style>
</head>
<body>
<div id="brand"><h1>黃名歷史博物館</h1><p>Wongming Museum of History · Architectural Study</p></div>
<div id="panel">
<div class="kicker">ARCHITECTURAL REFERENCE · M+</div>
<div class="title">以現實博物館建築為藍本</div>
<p class="copy">本館採用香港 M+ 的核心空間邏輯作為黃名版本：懸臂式大型基座、上升的縱向塔樓、公共屋頂花園、中央採光井與開放展覽空間。</p>
<button id="enter">ENTER IMMERSIVE VR</button><button id="timeBtn">切換至夜景 · NIGHT</button>
</div>
<div id="hint">WASD 移動・Shift 加速・N 日夜切換・點擊展區　｜　VR：Enter Immersive</div>
<div id="reticle"></div><div id="info"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {VRButton} from "three/addons/webxr/VRButton.js";
import {HDRLoader} from "three/addons/loaders/HDRLoader.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const scene=new THREE.Scene();
const nightSkyColor=new THREE.Color(0x02050d);
const dayFallbackColor=new THREE.Color(0x7f9db8);
let daySky=null;
let timeMode="day";
scene.background=dayFallbackColor.clone();
scene.backgroundBlurriness=0.12;
scene.backgroundIntensity=0.72;
scene.environmentIntensity=0.82;
scene.fog=new THREE.Fog(0x080a0d,34,150);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.05,260);
camera.position.set(0,1.7,32);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);

renderer.domElement.style.background="#080a0d";
const pmrem=new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
new HDRLoader()
  .setPath("https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/textures/equirectangular/")
  .load("venice_sunset_1k.hdr",(hdr)=>{
    hdr.mapping=THREE.EquirectangularReflectionMapping;
    daySky=hdr;
    scene.environment=hdr;
    if(timeMode==="day"){
      scene.background=daySky;
      scene.backgroundIntensity=0.66;
    }
    scene.environmentIntensity=timeMode==="day" ? 0.9 : 0.2;
  },undefined,(err)=>{
    console.warn("HDR sky failed; using procedural fallback.",err);
  });

// HDR sky/environment is loaded above; materials below are lit by both image-based light and a directional sun.
// ---------- realistic museum lawn ----------
// Outdoor ground uses the supplied Wongming forum grass image directly.
// It is intentionally unlit so architectural shadows cannot turn the lawn black.
const grassTexture=new THREE.TextureLoader().load(
  "https://cdn.jsdelivr.net/gh/annynn1990/wk@main/assets/gress2k.jpg",
  (tex)=>{
    tex.colorSpace=THREE.SRGBColorSpace;
    tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
    tex.repeat.set(5,5);
    tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
    realisticGrassSurface.map=tex;
    realisticGrassSurface.needsUpdate=true;
  },
  undefined,
  (err)=>{
    console.warn("wk/assets/gress2k.jpg unavailable; using natural green fallback.",err);
  }
);

const realisticGrassSurface=new THREE.MeshBasicMaterial({
  color:0x6d914f,
  toneMapped:false,
  side:THREE.DoubleSide
});

function createGrassSurface(width,depth,x,y,z){
  const geo=new THREE.PlaneGeometry(width,depth,96,72);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const px=pos.getX(i),py=pos.getY(i);
    const wave=
      Math.sin(px*.36+z*.11)*.018+
      Math.cos(py*.43+x*.08)*.014+
      Math.sin((px-py)*.72)*.008;
    pos.setZ(i,wave);
  }
  pos.needsUpdate=true;
  geo.computeVertexNormals();
  geo.rotateX(-Math.PI/2);
  const mesh=new THREE.Mesh(geo,realisticGrassSurface);
  mesh.position.set(x,y,z);
  mesh.receiveShadow=false;
  scene.add(mesh);
  return mesh;
}

const mat={
ground:new THREE.MeshStandardMaterial({color:0x34353a,roughness:.8}),
grass:new THREE.MeshStandardMaterial({color:0x33412f,roughness:.98}),
concrete:new THREE.MeshStandardMaterial({color:0x55565a,roughness:.86}),
concrete2:new THREE.MeshStandardMaterial({color:0x8d8e8a,roughness:.8}),
concreteLight:new THREE.MeshStandardMaterial({color:0xb3b0a6,roughness:.72}),
ceramic:new THREE.MeshStandardMaterial({color:0x6c6258,roughness:.56,metalness:.10}),
dark:new THREE.MeshStandardMaterial({color:0x2b3036,roughness:.72}),
glass:new THREE.MeshPhysicalMaterial({color:0x7793a4,roughness:.1,transmission:.42,transparent:true,opacity:.38,side:THREE.DoubleSide}),
glassDark:new THREE.MeshPhysicalMaterial({color:0x435762,roughness:.2,transmission:.35,transparent:true,opacity:.34,side:THREE.DoubleSide}),
gold:new THREE.MeshStandardMaterial({color:0xc5a15a,metalness:.78,roughness:.24}),
white:new THREE.MeshStandardMaterial({color:0xb8b5ad,roughness:.62}),
black:new THREE.MeshStandardMaterial({color:0x171b20,roughness:.84}),
water:new THREE.MeshPhysicalMaterial({color:0x203747,roughness:.07,transmission:.52,transparent:true,opacity:.7}),
light:new THREE.MeshBasicMaterial({color:0xf1d17d})
};

scene.add(new THREE.HemisphereLight(0xaebed1,0x100b07,1.15));
const key=new THREE.DirectionalLight(0xffdca0,2.25);key.position.set(-28,42,30);key.castShadow=true;key.shadow.mapSize.set(3072,3072);key.shadow.camera.near=1;key.shadow.camera.far=160;key.shadow.camera.left=-70;key.shadow.camera.right=70;key.shadow.camera.top=70;key.shadow.camera.bottom=-70;key.shadow.bias=-0.00025;scene.add(key);
const fill=new THREE.DirectionalLight(0x8ea4c7,.42);fill.position.set(32,18,-35);scene.add(fill);
const rim=new THREE.DirectionalLight(0xdde8ff,.3);rim.position.set(-30,12,-55);scene.add(rim);

const nightLights=[];
for(const x of [-7,-3.5,0,3.5,7]){
 const pl=new THREE.PointLight(0xffd27a,0,18,2);pl.position.set(x,5.5,2.1);scene.add(pl);nightLights.push(pl);
}
for(const p of [[-24,3,14],[-12,3,14],[0,3,14],[12,3,14],[24,3,14]]){
 const pl=new THREE.PointLight(0xc7d9ff,0,12,2);pl.position.set(...p);scene.add(pl);nightLights.push(pl);
}
const starGeo=new THREE.BufferGeometry();
const starPos=new Float32Array(1100*3);
for(let i=0;i<1100;i++){
 const a=i*12.9898,b=i*78.233,u=(Math.sin(a)*.5+.5)*2-1,t=(Math.sin(b)*.5+.5)*Math.PI*2,r=175,q=Math.sqrt(1-u*u);
 starPos[i*3]=r*q*Math.cos(t);starPos[i*3+1]=Math.max(18,r*u);starPos[i*3+2]=r*q*Math.sin(t);
}
starGeo.setAttribute("position",new THREE.BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.36,sizeAttenuation:true,transparent:true,opacity:0}));
scene.add(stars);

function add(g,m,p=[0,0,0],r=[0,0,0],cast=true){
 const o=new THREE.Mesh(g,m);o.position.set(...p);o.rotation.set(...r);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o;
}
function B(w,h,d,x,y,z,m=mat.concrete,r=[0,0,0]){const cast=r===false?false:true;const rot=r===false?[0,0,0]:r;return add(new THREE.BoxGeometry(w,h,d),m,[x,y,z],rot,cast)}
function C(r,h,x,y,z,m=mat.concrete,seg=28){return add(new THREE.CylinderGeometry(r,r,h,seg),m,[x,y,z])}

// ---------- monumental automatic entrance ----------
const entranceDoors=[];
const entranceLights=[];
function makeSlidingDoor(x0){
  const door=add(new THREE.BoxGeometry(3.55,6.75,.12),mat.glass,[x0,3.69,10.72]);
  door.userData.closedX=x0;
  door.userData.side=x0<0?-1:1;
  entranceDoors.push(door);
}
// One continuous outdoor lawn. No concrete slab underneath it.
createGrassSurface(110,106,0,.07,-10);


// harbor water behind
B(92,.08,18,0,.03,-72,mat.water,false);


// ---------- M+ style upside-down T massing ----------
// podium: broad horizontal base, raised and cantilevered
// Original M+ massing kept intact; only the podium is converted to a walkable shell.
// Lower podium underside: keep the central entrance axis completely open.
 // Side masses remain intact while the visitor route stays bright and unobstructed.
B(20,.42,48,-19,2.72,-13,mat.dark,false);
B(20,.42,48,19,2.72,-13,mat.dark,false);
B(58,.42,48,0,6.38,-13,mat.dark,false);
B(.75,3.25,48,-28.65,4.55,-13,mat.dark);
B(.75,3.25,48,28.65,4.55,-13,mat.dark);
B(58,3.25,.75,0,4.55,-36.65,mat.dark);
B(9.0,3.25,.75,-24.5,4.55,10.62,mat.glassDark);
B(9.0,3.25,.75,24.5,4.55,10.62,mat.glassDark);
B(62,1.0,50,0,7.0,-13,mat.ceramic);
B(66,.55,54,0,9.25,-13,mat.black);

// tower: slim vertical block fused into podium
B(22,27,21,2,22.0,-10,mat.dark);
B(24,.8,23,2,35.8,-10,mat.black);
B(23,1.0,22,2,8.9,-10,mat.ceramic);

// slight offset creates distinctive monolithic silhouette
B(3,24,15.0,14.2,22,-10,mat.black);

// ---------- facade terracotta / vertical fins ----------
const finGeo=new THREE.BoxGeometry(.22,3.15,.34);
const finMat=new THREE.MeshStandardMaterial({color:0x73685d,roughness:.58,metalness:.08});
function finsFront(y,z,width,step,top){
 const n=Math.floor(width/step);
 const im=new THREE.InstancedMesh(finGeo,finMat,n);im.castShadow=true;
 for(let i=0;i<n;i++){
  const x=-width/2+i*step;
  const m=new THREE.Matrix4().makeTranslation(x,y,z);
  im.setMatrixAt(i,m);
 }
 im.instanceMatrix.needsUpdate=true;scene.add(im);
}
for(let y=8.3;y<35.6;y+=3.3)finsFront(y,-21.7,59,0.48,0);
for(let y=9;y<35.6;y+=3.4)finsFront(y,1.2,59,0.48,0);

// tower vertical louvers
const towerFinGeo=new THREE.BoxGeometry(.16,25,.34);
const towerFinCount=54, towerFinStep=.415, towerFinStart=2-11.2;
const im1=new THREE.InstancedMesh(towerFinGeo,mat.ceramic,towerFinCount);im1.castShadow=true;
for(let i=0;i<towerFinCount;i++){const x=towerFinStart+i*towerFinStep;im1.setMatrixAt(i,new THREE.Matrix4().makeTranslation(x,22,-20.7))}
im1.instanceMatrix.needsUpdate=true;scene.add(im1);
const im2=new THREE.InstancedMesh(towerFinGeo,mat.ceramic,towerFinCount);im2.castShadow=true;
for(let i=0;i<towerFinCount;i++){const x=towerFinStart+i*towerFinStep;im2.setMatrixAt(i,new THREE.Matrix4().makeTranslation(x,22,0.7))}
im2.instanceMatrix.needsUpdate=true;scene.add(im2);

// ---------- COMPLETE INTERIOR REBUILD ----------
const groundFloorTop=.72;
const groundFloorSlabY=groundFloorTop-.09;
const interiorFloorMat=new THREE.MeshStandardMaterial({color:0xc8c5bc,roughness:.74});
const interiorWallMat=new THREE.MeshStandardMaterial({color:0xd8d4ca,roughness:.78});
const interiorTrimMat=new THREE.MeshStandardMaterial({color:0x9b7a4f,metalness:.16,roughness:.42});
const walnutMat=new THREE.MeshStandardMaterial({color:0x654b39,roughness:.64});
const galleryAccentMat=new THREE.MeshStandardMaterial({color:0x8d7561,roughness:.68});
const displayGlassMat=new THREE.MeshPhysicalMaterial({color:0xc7d7dc,roughness:.08,transmission:.30,transparent:true,opacity:.48,side:THREE.DoubleSide});
const ceilingMat=new THREE.MeshStandardMaterial({color:0xe2dfd7,roughness:.9});
const warmLightMat=new THREE.MeshBasicMaterial({color:0xffd889});
const signMat=new THREE.MeshStandardMaterial({color:0x8b6f47,metalness:.18,roughness:.46});

// Base foundation stays below the new interior and is no longer used as a visual floor.
const foundationMat=mat.concrete2;
B(58,.34,43.2,0,.25,-13.0,foundationMat,false,true);
B(18.0,.22,4.8,-20.0,.42,8.25,foundationMat,false,true);
B(18.0,.22,4.8,20.0,.42,8.25,foundationMat,false,true);
B(13.2,.22,3.6,0,.42,8.15,foundationMat,false,true);

// ---------- GROUND FLOOR: open public hall ----------
B(54,.18,44,0,groundFloorSlabY,-12.8,interiorFloorMat,false);

// Clean light ceiling panels hide the dark structural underside while preserving the central void.
B(19.2,.10,38,-17.1,6.08,-14.0,ceilingMat,false);
B(19.2,.10,38,17.1,6.08,-14.0,ceilingMat,false);
B(13.2,.10,8.0,0,6.08,7.0,ceilingMat,false);
B(13.2,.10,7.2,0,6.08,-30.0,ceilingMat,false);

// Perimeter structure only. No full-height black blocks in the public interior.
for(const x of [-25,-19,19,25])C(.30,5.15,x,3.25,-14.0,interiorTrimMat,24);
for(const z of [-33,-26,-19,-12,-5])C(.22,4.85,-25,3.05,z,interiorTrimMat,20);
for(const z of [-33,-26,-19,-12,-5])C(.22,4.85,25,3.05,z,interiorTrimMat,20);

// ---------- MAIN ENTRANCE / MONUMENTAL PORTAL ----------
B(23,.72,7.8,0,8.45,13.85,mat.black);
B(19,.18,7.1,0,8.08,10.95,mat.gold);
B(21,6.7,.34,-13.0,4.35,11.02,mat.glass);
B(21,6.7,.34,13.0,4.35,11.02,mat.glass);

// No entrance pillars in the center approach.
makeSlidingDoor(-1.78);
makeSlidingDoor(1.78);

B(14.2,.16,.20,0,7.12,10.70,mat.gold);
const sensorBar=B(13.8,.11,.12,0,7.28,10.58,mat.light,false);
sensorBar.userData.entranceSensor=true;
entranceLights.push(sensorBar);

// Central main light stays exactly in the entrance axis.
const centralLampLight=new THREE.PointLight(0xffd89a,68,24,1.7);
centralLampLight.position.set(0,6.35,8.0);
centralLampLight.castShadow=false;
scene.add(centralLampLight);

const centralLampGroup=new THREE.Group();
centralLampGroup.position.set(0,6.55,8.0);
scene.add(centralLampGroup);

const t0LampPlate=add(
  new THREE.BoxGeometry(5.8,.16,1.18),
  new THREE.MeshStandardMaterial({color:0xc9a85f,metalness:.45,roughness:.28}),
  [0,6.88,8.02],[0,0,0],false
);
const t0LampGlow=add(
  new THREE.BoxGeometry(4.6,.045,.62),
  new THREE.MeshBasicMaterial({color:0xffdda0,transparent:true,opacity:.92}),
  [0,6.76,8.02],[0,0,0],false
);
const t0LampPoint=new THREE.PointLight(0xffd28a,28,16,1.8);
t0LampPoint.position.set(0,6.55,8.0);
scene.add(t0LampPoint);

for(const x of [-5.8,5.8]){
  const glow=B(3.0,2.5,.045,x,4.0,10.92,new THREE.MeshBasicMaterial({color:0xffd58a,transparent:true,opacity:.55,side:THREE.DoubleSide}),false);
  glow.material.depthWrite=false;
}
for(const x of [-5.8,0,5.8]){
  const pl=new THREE.PointLight(0xffc978,10,13,1.8);
  pl.position.set(x,4.8,9.0);
  scene.add(pl);
}

const centralLampLoader=new GLTFLoader();
centralLampLoader.load(
  "https://cdn.jsdelivr.net/gh/annynn1990/wk@main/assets/750221_and_750223_favo_lightstar_ceiling_lamp.glb",
  (gltf)=>{
    const lamp=gltf.scene;
    lamp.traverse((o)=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    const box=new THREE.Box3().setFromObject(lamp);
    const size=box.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z);
    if(maxDim>0)lamp.scale.setScalar(4.4/maxDim);
    const scaledBox=new THREE.Box3().setFromObject(lamp);
    const center=scaledBox.getCenter(new THREE.Vector3());
    lamp.position.sub(center);
    centralLampGroup.add(lamp);
  },
  undefined,
  (err)=>console.warn("Central ceiling lamp GLB failed to load.",err)
);

const sensorIndicator=B(.20,.20,.08,0,7.12,10.56,mat.light,false);
entranceLights.push(sensorIndicator);

// Entrance marquee.
function makeFallbackMarquee(){
  const cc=document.createElement("canvas");cc.width=1600;cc.height=420;
  const g=cc.getContext("2d");g.textAlign="center";
  g.fillStyle="#68181b";g.fillRect(0,0,cc.width,cc.height);
  g.strokeStyle="#d9b56d";g.lineWidth=10;g.strokeRect(22,22,cc.width-44,cc.height-44);
  g.fillStyle="#f3dfac";g.font="700 106px serif";g.fillText("帝國歷史博物館",800,185);
  g.fillStyle="#e5d2a2";g.font="32px sans-serif";g.fillText("WONGMING MUSEUM OF HISTORY",800,270);
  g.fillStyle="#f0c76c";g.font="24px sans-serif";g.fillText("WMMOH",800,325);
  return new THREE.CanvasTexture(cc);
}
const marqueeMaterial=new THREE.MeshBasicMaterial({map:makeFallbackMarquee(),side:THREE.DoubleSide});
const marquee=add(new THREE.PlaneGeometry(16.6,3.45),marqueeMaterial,[0,6.08,10.12],[0,0,0],false);
new THREE.TextureLoader().load("/api/museum-banner",(tex)=>{
  tex.colorSpace=THREE.SRGBColorSpace;
  marqueeMaterial.map=tex;
  marqueeMaterial.needsUpdate=true;
},undefined,(err)=>console.warn("Forum banner unavailable; fallback marquee remains.",err));

// ---------- FIRST FLOOR EXHIBITION DESIGN ----------
function addFirstFloorGallery(x,z,title,side){
  const w=9.4,d=5.8,h=3.25;
  const backX=x+side*(w/2);
  const innerX=x-side*(w/2);
  // Back feature wall, intentionally low enough to preserve sight lines.
  B(.22,h,d,backX,groundFloorTop+h/2,z,interiorWallMat);
  // Short side fins define the gallery without closing the hall.
  B(.16,2.65,2.25,innerX+side*.05,groundFloorTop+1.325,z-1.77,interiorWallMat);
  B(.16,2.65,2.25,innerX+side*.05,groundFloorTop+1.325,z+1.77,interiorWallMat);
  // Warm wood display spine.
  B(.18,2.35,4.2,backX-side*.18,groundFloorTop+1.18,z,walnutMat);
  // Three independent vitrines.
  for(const dz of [-1.7,0,1.7]){
    B(1.7,.14,1.05,x-side*.9,groundFloorTop+.07,z+dz,interiorTrimMat,false);
    B(1.42,.82,.82,x-side*.9,groundFloorTop+.55,z+dz,displayGlassMat,false);
    B(1.1,.05,.64,x-side*.9,groundFloorTop+.98,z+dz,mat.gold,false);
  }
  // Floating identification plaque facing the central aisle.
  const cc=document.createElement("canvas");cc.width=1000;cc.height=240;
  const q=cc.getContext("2d");q.clearRect(0,0,1000,240);q.textAlign="center";

// Human-scale floor elevations: footsteps and ramps create real vertical movement.
let currentLevel=0;
function stairProgress(x,z){
  if(x>stairX-2.7&&x<stairX+2.7&&z<=stairStartZ&&z>=stairStartZ-stairSteps*stairRun){
    return Math.max(0,Math.min(1,(stairStartZ-z)/(stairSteps*stairRun)));
  }
  return -1;
}
function entranceStepHeight(x,z){
  if(Math.abs(x)>5.9)return -1;
  for(let i=0;i<5;i++){
    const centerZ=15.05-i*.86;
    const halfZ=.43;
    const width=(11.6-i*.32)/2;
    if(Math.abs(z-centerZ)<=halfZ && Math.abs(x)<=width){
      return (i+1)*.12+.035;
    }
  }
  // The red-carpet vestibule is a single raised landing.
  if(Math.abs(x)<=6.5 && z>=5.35 && z<=11.9)return groundFloorTop;
  return -1;
}
function groundHeight(x,z){
  const p=stairProgress(x,z);
  if(p>=0){
    if(currentLevel===0&&p>.92)currentLevel=1;
    if(currentLevel===1&&p<.08)currentLevel=0;
    return .56+p*(level2Y-.56);
  }

  const entranceH=entranceStepHeight(x,z);
  if(entranceH>=0)return entranceH;

  if(currentLevel===1)return level2Y;

  // Entire ground-floor interior uses the single finished-floor elevation.
  if(z>9.2 || x<-28 || x>28)return .07;

  return groundFloorTop;
}

  // Side wings are continuous from the outer walls to the atrium edge.

function insideRect(x,z,r){return x>r.minX&&x<r.maxX&&z>r.minZ&&z<r.maxZ;}
function blockedAt(x,z){
  if(currentLevel===1&&stairProgress(x,z)<0&&!upperFloorWalkable(x,z))return true;
  for(const r of colliders)if(x>r.minX&&x<r.maxX&&z>r.minZ&&z<r.maxZ)return true;

function moveWithCollision(dx,dz){
  const nx=camera.position.x+dx;
  const nz=camera.position.z+dz;

  // Main entrance corridor: force a clear path through the original center opening.
  // This is deliberately checked before general collision so the old facade never
  // traps the camera outside the museum.
  const portalNow =
    camera.position.z > 7.0 && camera.position.z < 24.0 &&
    Math.abs(camera.position.x) < 8.2;

  const portalNext =
    nz > 7.0 && nz < 24.0 &&
    Math.abs(nx) < 8.2;

  if(portalNow || portalNext){
    camera.position.x = THREE.MathUtils.clamp(nx,-8.15,8.15);
    camera.position.z = nz;
    return;
  }

  if(!blockedAt(nx,camera.position.z)) camera.position.x=nx;
  if(!blockedAt(camera.position.x,nz)) camera.position.z=nz;
}

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup",e=>{keys[e.code]=false;});


// immersive
document.getElementById("enter").onclick=()=>{
 if(renderer.xr.isPresenting)return;
 const b=VRButton.createButton(renderer);
 b.style.position="fixed";b.style.bottom="48px";b.style.left="50%";b.style.transform="translateX(-50%)";b.style.zIndex="50";
 document.body.appendChild(b);b.click();
};

const clock=new THREE.Clock();
function animate(){
 const dt=Math.min(clock.getDelta(),.045);
 updateEntrance(dt);
 if(!renderer.xr.isPresenting){
   const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
   const sp=(keys.ShiftLeft?6.4:3.1)*dt;
   let mdx=0,mdz=0;
   if(keys.KeyW||keys.ArrowUp){mdx+=-f.x*sp;mdz+=-f.z*sp;}
   if(keys.KeyS||keys.ArrowDown){mdx+=f.x*sp;mdz+=f.z*sp;}
   if(keys.KeyA||keys.ArrowLeft){mdx+=-r.x*sp;mdz+=-r.z*sp;}
   if(keys.KeyD||keys.ArrowRight){mdx+=r.x*sp;mdz+=r.z*sp;}
   moveWithCollision(mdx,mdz);
   const floorY=groundHeight(camera.position.x,camera.position.z);
   camera.position.y += ((floorY+1.68)-camera.position.y)*Math.min(1,dt*10);
   camera.position.x=Math.max(-37,Math.min(37,camera.position.x));camera.position.z=Math.max(-74,Math.min(41,camera.position.z));
   camera.rotation.set(pitch,yaw,0,"YXZ");
 }
 const t=performance.now()*.001;
 scene.traverse(o=>{if(o.userData&&o.userData.led&&o.material&&o.material.color){const n=o.position.x*7+o.position.y*3;const v=.12+.18*(.5+.5*Math.sin(t*1.25+n));o.material.color.setHSL(.56,.28,.08+v)}});
 renderer.render(scene,camera);
}
applyTimeMode("day");
renderer.setAnimationLoop(animate);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
