<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黃名歷史博物館｜Wongming Museum of History</title>
<style>
:root{--gold:#d4b06a;--ink:#f4eee1;--muted:#b8bec5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:var(--ink);font-family:Inter,"Noto Sans TC","Noto Serif TC",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#brand{position:fixed;z-index:20;top:22px;left:26px;text-shadow:0 4px 28px #000;pointer-events:none}
#brand h1{margin:0;font:600 28px/1.1 "Noto Serif TC",serif;letter-spacing:.14em}
#brand p{margin:8px 0 0;font-size:10px;letter-spacing:.16em;color:#c3c7cd;text-transform:uppercase}
#panel{position:fixed;z-index:20;top:20px;right:20px;width:300px;padding:16px;background:#0b0f14d9;border:1px solid #fff2;box-shadow:0 18px 55px #0008;backdrop-filter:blur(15px)}
.kicker{font-size:9px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.title{margin:7px 0 6px;font-size:18px}
.copy{margin:0;color:#b9c0c7;font-size:12px;line-height:1.75}
button{width:100%;height:39px;margin-top:10px;border:1px solid #ba9654;background:#14181d;color:#ead9ad;letter-spacing:.1em;font-size:11px;cursor:pointer}
#hint{position:fixed;z-index:20;left:50%;bottom:16px;transform:translateX(-50%);padding:9px 14px;background:#090c10dd;border:1px solid #fff2;color:#b5bcc3;font-size:11px;white-space:nowrap}
#info{position:fixed;z-index:21;left:50%;bottom:66px;transform:translateX(-50%);display:none;max-width:min(620px,88vw);padding:12px 17px;background:#090c10ee;border:1px solid #fff2;box-shadow:0 16px 45px #0009;color:#d8dde1;font-size:12px;line-height:1.7}
#info strong{color:#ead5a0}
@media(max-width:700px){#panel{width:235px;right:10px;top:10px}#brand{left:12px;top:12px}#hint{display:none}}
</style>
</head>
<body>
<div id="brand"><h1>黃名歷史博物館</h1><p>WMMOH · WONGMING MUSEUM OF HISTORY</p></div>
<div id="panel">
  <div class="kicker">WONGMING MUSEUM · WMMOH</div>
  <div class="title">帝國歷史博物館</div>
  <p class="copy">從中央紅毯入口進入大堂，左右分流至十個歷史展廳；中央大階梯可前往二樓公共展廊。</p>
  <button id="enter">ENTER IMMERSIVE VR</button>
  <button id="timeBtn">切換至夜景 · NIGHT</button>
</div>
<div id="hint">WASD／方向鍵 移動・Shift 加速・N 日夜切換・點擊看展區・VR</div>
<div id="info"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import {VRButton} from "three/addons/webxr/VRButton.js";

const scene=new THREE.Scene();
const nightSky=new THREE.Color(0x02050b);
const dayFallback=new THREE.Color(0x7d9bb4);
let dayBannerTexture=null;
let timeMode="day";

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.05,240);
camera.position.set(0,1.7,27);
camera.rotation.set(0,0,0,"YXZ");

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.04;
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);

scene.background=dayFallback.clone();
scene.fog=new THREE.Fog(0x0a0d12,34,150);

const hemi=new THREE.HemisphereLight(0xaec3d9,0x1d1710,1.05);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffdfaa,2.15);
sun.position.set(-30,42,28);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-70;sun.shadow.camera.right=70;
sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x8fa8c9,.38);fill.position.set(26,20,-28);scene.add(fill);
const rim=new THREE.DirectionalLight(0xe8efff,.28);rim.position.set(-20,16,-50);scene.add(rim);

const mat={
  ground:new THREE.MeshStandardMaterial({color:0x4a4b4f,roughness:.9}),
  pavement:new THREE.MeshStandardMaterial({color:0x6d6e72,roughness:.82}),
  concrete:new THREE.MeshStandardMaterial({color:0x56585d,roughness:.86}),
  concreteLight:new THREE.MeshStandardMaterial({color:0x83858a,roughness:.78}),
  dark:new THREE.MeshStandardMaterial({color:0x11151a,roughness:.8}),
  black:new THREE.MeshStandardMaterial({color:0x07090c,roughness:.92}),
  ceramic:new THREE.MeshStandardMaterial({color:0x3f3d3a,roughness:.64,metalness:.05}),
  gold:new THREE.MeshStandardMaterial({color:0xc7a25f,roughness:.25,metalness:.72}),
  glass:new THREE.MeshPhysicalMaterial({color:0x9db8c7,roughness:.08,transmission:.35,opacity:.36,transparent:true,side:THREE.DoubleSide}),
  glassDark:new THREE.MeshPhysicalMaterial({color:0x435663,roughness:.18,transmission:.18,opacity:.62,transparent:true,side:THREE.DoubleSide}),
  white:new THREE.MeshStandardMaterial({color:0xd0cec8,roughness:.6}),
  red:new THREE.MeshStandardMaterial({color:0x72161b,roughness:.78}),
  green:new THREE.MeshStandardMaterial({color:0x354c39,roughness:.96}),
  light:new THREE.MeshBasicMaterial({color:0xffdf9b})
};

function add(g,m,p=[0,0,0],r=[0,0,0],cast=true){
  const o=new THREE.Mesh(g,m);
  o.position.set(...p);o.rotation.set(...r);
  o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o;
}
function box(w,h,d,x,y,z,m=mat.concrete,r=[0,0,0],cast=true){
  const rot=r===false?[0,0,0]:r;
  const doCast=r===false?false:cast;
  return add(new THREE.BoxGeometry(w,h,d),m,[x,y,z],rot,doCast);
}
function cyl(rad,h,x,y,z,m=mat.concrete,seg=24,cast=true){
  return add(new THREE.CylinderGeometry(rad,rad,h,seg),m,[x,y,z],[0,0,0],cast);
}

// ---------- SITE ----------
box(120,.4,110,0,-.22,-12,mat.ground,false,false);
box(82,.08,38,0,.02,27,mat.pavement,[0,0,0],false);

// approach plaza
box(52,.05,23,0,.04,16,mat.pavement,[0,0,0],false);
box(7.4,.035,28,0,.075,20,mat.red,[0,0,0],false);

// shallow landscape bands, kept away from the carpet
for(let x=-32;x<=32;x+=8) box(4.5,.06,34,x,.09,28,mat.green,[0,0,0],false);

// ---------- MAIN BUILDING SHELL ----------
// broad podium + upper tower, centered on x=0.
box(58,7.0,45,0,3.5,-13,mat.dark);
box(62,1.0,49,0,7.5,-13,mat.ceramic);
box(66,.6,53,0,8.3,-13,mat.black);

box(22,28,20,0,22,-9,mat.dark);
box(24,.8,22,0,36.1,-9,mat.black);

// front glazing above the public hall
box(54,6.5,.35,0,4.1,8.5,mat.glassDark);

// ---------- TRUE FRONT ENTRANCE ----------
// The door is the only opening in the center of the front curtain wall.
const entranceDoors=[];
const entranceLights=[];
function makeDoor(x0){
  const d=box(3.0,4.9,.10,x0,2.55,8.31,mat.glass,[0,0,0],false);
  d.userData.closedX=x0;
  d.userData.side=x0<0?-1:1;
  entranceDoors.push(d);
}
makeDoor(-1.55);makeDoor(1.55);

// side portal columns sit outside the 6 m opening; no central column.
for(const x of [-7.0,7.0]) box(.34,5.3,.32,x,2.7,8.30,mat.gold);
box(7.0,.18,.24,0,5.15,8.30,mat.gold);

// entrance canopy, set behind the sign and above the doors
box(19,.55,5.8,0,6.45,10.9,mat.black);
box(17,.12,5.2,0,6.17,8.95,mat.gold);

// sensor
const sensor=box(5.5,.10,.10,0,5.31,8.19,mat.light,[0,0,0],false);
entranceLights.push(sensor);

// ---------- WMMOH / BANNER ----------
function makeFallbackBanner(){
  const c=document.createElement("canvas");c.width=1600;c.height=360;
  const g=c.getContext("2d");g.textAlign="center";
  g.fillStyle="#68181b";g.fillRect(0,0,c.width,c.height);
  g.strokeStyle="#d6b267";g.lineWidth=10;g.strokeRect(18,18,c.width-36,c.height-36);
  g.fillStyle="#f3dfa9";g.font="700 104px serif";g.fillText("帝國歷史博物館",800,157);
  g.fillStyle="#e3cf9e";g.font="30px sans-serif";g.fillText("WONGMING MUSEUM OF HISTORY",800,229);
  g.fillStyle="#efc66d";g.font="700 24px sans-serif";g.fillText("WMMOH",800,292);
  return new THREE.CanvasTexture(c);
}
const fallbackBanner=makeFallbackBanner();
const bannerMat=new THREE.MeshBasicMaterial({map:fallbackBanner,side:THREE.DoubleSide});
const banner=add(new THREE.PlaneGeometry(17.5,3.95),bannerMat,[0,8.0,8.17],[0,0,0],false);
new THREE.TextureLoader().load("/api/museum-banner",(tex)=>{
  tex.colorSpace=THREE.SRGBColorSpace;
  dayBannerTexture=tex;
  banner.material.map=tex;
  banner.material.needsUpdate=true;
},undefined,()=>{});

// physical WMMOH letters on the tower facade
const wmmohCanvas=document.createElement("canvas");wmmohCanvas.width=1200;wmmohCanvas.height=240;
const wmmohCtx=wmmohCanvas.getContext("2d");wmmohCtx.clearRect(0,0,1200,240);wmmohCtx.textAlign="center";
wmmohCtx.fillStyle="#ead39a";wmmohCtx.font="800 126px sans-serif";wmmohCtx.fillText("WMMOH",600,145);
const wmmohTex=new THREE.CanvasTexture(wmmohCanvas);
add(new THREE.PlaneGeometry(17,3.4),new THREE.MeshBasicMaterial({map:wmmohTex,transparent:true,side:THREE.DoubleSide}),[0,14.0,-19.2],[0,0,0],false);

// ---------- GRAND STAIR TO LEVEL 2 ----------
// A straight visible stair in the lobby, 18 risers, physically matching groundHeight().
const stairX=-5.8;
const stairStartZ=4.6;
const stairStepDepth=.42;
const stairStepH=.36;
for(let i=0;i<18;i++){
  const y=(i+1)*stairStepH;
  const z=stairStartZ-i*stairStepDepth;
  box(5.0,.36,stairStepDepth,stairX,y-.18,z,mat.concreteLight);
}
box(5.0,.18,1.4,stairX,6.58,stairStartZ-18*stairStepDepth-.55,mat.concreteLight);
for(const x of [stairX-2.35,stairX+2.35]) box(.10,6.6,1.0,x,3.3,1.0,mat.gold,false);

// second-floor public balcony
box(22,.20,36,0,6.72,-12,mat.ceramic,[0,0,0],false);
for(const x of [-10,-5,0,5,10]){
  box(.08,1.1,.08,x,7.3,-12,mat.gold,false);
}
box(22,.08,.08,0,7.8,-12,mat.gold,false);

// ---------- CENTRAL ATRIUM ----------
box(11,.12,22,0,.08,-2,mat.pavement,[0,0,0],false);
box(9.5,6.5,.16,0,3.3,-5.2,mat.glassDark);
box(9.5,6.5,.16,0,3.3,-28,mat.glassDark);

// ---------- TEN GALLERIES ----------
const galleryData=[
 {title:"帝國紀念廳",sub:"紀念本國功勛人士",kind:"MEMORIAL"},
 {title:"黃名歷史廳",sub:"黃名帝國歷史展覽",kind:"WONGMING HISTORY"},
 {title:"微國歷史廳",sub:"微國歷史展覽",kind:"MICRONATION HISTORY"},
 {title:"黃名專題廳",sub:"黃名帝國專題歷史介紹",kind:"SPECIAL COLLECTION"},
 {title:"黃名文物廳",sub:"黃名帝國文物展覽",kind:"ARTIFACTS"},
 {title:"微國專題廳",sub:"微國專題歷史介紹",kind:"MICRONATION TOPICS"},
 {title:"微國文物廳",sub:"微國文物展覽",kind:"MICRONATION ARTIFACTS"},
 {title:"歷史回顧廳",sub:"討論黃名或微國歷史故事",kind:"HISTORICAL REVIEW"},
 {title:"文化景區中心",sub:"全國歷史建築與景區導覽中心",kind:"CULTURAL SITES"},
 {title:"歷史文物局辦公室",sub:"本國歷史研究及文物事務部門",kind:"HERITAGE OFFICE"}
];
const rows=[1.2,-5.3,-11.8,-18.3,-24.8];

function labelTexture(g){
  const c=document.createElement("canvas");c.width=820;c.height=190;
  const q=c.getContext("2d");q.fillStyle="#11151a";q.fillRect(0,0,820,190);
  q.strokeStyle="#d1ac62";q.lineWidth=5;q.strokeRect(8,8,804,174);
  q.textAlign="center";q.fillStyle="#f0dda9";q.font="700 43px serif";q.fillText(g.title,410,76);
  q.fillStyle="#b8bec5";q.font="18px sans-serif";q.fillText(g.kind,410,112);
  q.font="17px sans-serif";q.fillText(g.sub,410,144);
  return new THREE.CanvasTexture(c);
}
function makeGallery(g,x,z,side,index){
  const w=10.5,d=5.4,h=6.0;
  const y=0.12;
  // back/outer walls, with open corridor side
  box(w,.28,d,x,h/2,z-d/2,mat.dark);
  box(.25,h,d,x+side*(w/2),h/2,z,mat.dark);

  const doorX=x-side*(w/2);
  const seg=(d-2.5)/2;
  box(.25,h,seg,doorX,h/2,z-(2.5+seg)/2,mat.dark);
  box(.25,h,seg,doorX,h/2,z+(2.5+seg)/2,mat.dark);

  // Actual plaque above the actual doorway, facing the corridor.
  const plaque=add(new THREE.PlaneGeometry(3.6,.86),new THREE.MeshBasicMaterial({map:labelTexture(g),side:THREE.DoubleSide}),[doorX-side*.04,4.95,z],[0,side*Math.PI/2,0],false);

  // wall exhibits, plinths and cases
  for(const px of [x-2.1,x+2.1]){
    box(2.1,.24,1.25,px,.28,z,mat.black,[0,0,0],false);
    box(1.8,1.0,1.0,px,.9,z,mat.glass,[0,0,0],false);
    box(1.45,.06,.72,px,1.45,z,mat.gold,[0,0,0],false);
  }
  for(const px of [x-3.4,x,x+3.4]){
    box(2.2,2.0,.10,px,3.0,z-d/2-.07,mat.white,[0,0,0],false);
    box(2.0,1.8,.05,px,3.0,z-d/2-.14,mat.gold,[0,0,0],false);
  }

  // visitor bench
  box(3.0,.16,.5,x,.95,z+1.1,mat.ceramic,[0,0,0],false);
  box(.1,.72,.1,x-1.1,.52,z+1.1,mat.black,[0,0,0],false);
  box(.1,.72,.1,x+1.1,.52,z+1.1,mat.black,[0,0,0],false);

  // ceiling track lights
  box(5.5,.08,.10,x,5.68,z,mat.black,[0,0,0],false);
  for(const px of [x-2.1,x-.7,x+.7,x+2.1]){
    cyl(.07,.18,px,5.48,z,mat.black,18,false);
    cyl(.12,.07,px,5.36,z,mat.light,18,false);
  }
}
for(let i=0;i<5;i++){
  makeGallery(galleryData[i],-17,rows[i],-1,i);
  makeGallery(galleryData[i+5],17,rows[i],1,i+5);
}

// ---------- SECOND FLOOR EXHIBITION DECK ----------
const upperTitles=[
  "帝國紀念廳 · 二樓展廊",
  "黃名歷史廳 · 二樓文獻",
  "微國歷史廳 · 二樓檔案",
  "文化景區中心 · 二樓觀景廊"
];
for(let i=0;i<4;i++){
  const z=-7-i*7.0;
  box(13,.12,5.2,0,6.84,z,mat.concreteLight,[0,0,0],false);
  box(12.0,.05,.08,0,7.58,z-2.1,mat.gold,[0,0,0],false);
}

// ---------- EXTERIOR LANDSCAPE / WAYFINDING ----------
for(let x=-24;x<=24;x+=8){
  cyl(.10,2.3,x,1.15,21,mat.gold,18,false);
  cyl(.32,.07,x,2.34,21,mat.light,24,false);
}

// ---------- HOTSPOTS ----------
const hotspots=[
  {p:new THREE.Vector3(0,1.2,7.9),title:"中央入口大堂",text:"紅毯從城市廣場直接進入大堂，兩側通往十個展廳，左側大階梯通往二樓。"},
  ...galleryData.map((g,i)=>({p:new THREE.Vector3(i<5?-17:17,1.4,rows[i%5]),title:g.title,text:g.sub}))
];
const ringMat=new THREE.MeshBasicMaterial({color:0xd2ae65});
hotspots.forEach(h=>{
  const r=new THREE.Mesh(new THREE.RingGeometry(.58,.66,32),ringMat);
  r.rotation.x=-Math.PI/2;r.position.set(h.p.x,.04,h.p.z);r.userData=h;scene.add(r);
});

// ---------- COLLISION / FLOOR ----------
const colliders=[];
function rect(minX,maxX,minZ,maxZ){colliders.push({minX,maxX,minZ,maxZ});}

// outer shell
rect(-29,-28.25,-35,8.35);rect(28.25,29,-35,8.35);rect(-28.3,28.3,-35,-34.25);
// front wall, keep central 7.2 m opening
rect(-28.3,-3.65,8.2,8.65);rect(3.65,28.3,8.2,8.65);

// gallery shells, with corridor-side doorway openings
for(const z of rows){
  rect(-22.35,-11.75,z-2.75,z-2.35);
  rect(-22.35,-11.75,z+2.35,z+2.75);
  rect(-22.55,-22.0,z-2.35,z+2.35);
  rect(-11.95,-11.45,z-2.75,z-1.28);rect(-11.95,-11.45,z+1.28,z+2.75);
  rect(11.45,11.95,z-2.75,z-1.28);rect(11.45,11.95,z+1.28,z+2.75);
  rect(22.0,22.55,z-2.35,z+2.35);
}

// gallery benches/cases intentionally non-colliding; visitors can navigate naturally.
function blockedAt(x,z){
  for(const r of colliders) if(x>r.minX&&x<r.maxX&&z>r.minZ&&z<r.maxZ) return true;
  for(const d of entranceDoors){
    if(Math.abs(d.position.x-x)<1.52 && Math.abs(z-8.31)<.14) return true;
  }
  return false;
}

// Floor levels: lobby 0, stair rises continuously to second floor, upper deck 6.5 m.
function floorHeight(x,z){
  if(x>-8.8&&x<-2.8&&z<4.75&&z>-3.15){
    const t=Math.max(0,Math.min(1,(4.55-z)/(4.55+3.0)));
    return t*6.48;
  }
  if(Math.abs(x)<11.0 && z<=-3.15) return 6.48;
  return 0;
}

function moveWithCollision(dx,dz){
  const nx=camera.position.x+dx;
  if(!blockedAt(nx,camera.position.z)) camera.position.x=nx;
  const nz=camera.position.z+dz;
  if(!blockedAt(camera.position.x,nz)) camera.position.z=nz;
}

// ---------- DAY / NIGHT ----------
const nightLights=[];
function pointLight(x,y,z,color,intensity){
  const p=new THREE.PointLight(color,0,22,2);
  p.position.set(x,y,z);scene.add(p);nightLights.push({p,intensity});return p;
}
for(const x of [-6,-3,0,3,6]) pointLight(x,4.8,8.2,0xffd27a,20);
for(const x of [-20,0,20]) pointLight(x,3,20,0xd9e6ff,8);

const starGeo=new THREE.BufferGeometry();
const starPos=new Float32Array(1000*3);
for(let i=0;i<1000;i++){
  const a=i*13.37,b=i*31.71,u=(Math.sin(a)*.5+.5)*2-1,t=(Math.sin(b)*.5+.5)*Math.PI*2,r=175,q=Math.sqrt(1-u*u);
  starPos[i*3]=r*q*Math.cos(t);starPos[i*3+1]=Math.max(20,r*u);starPos[i*3+2]=r*q*Math.sin(t);
}
starGeo.setAttribute("position",new THREE.BufferAttribute(starPos,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.35,transparent:true,opacity:0}));
scene.add(stars);

function applyTimeMode(mode){
  timeMode=mode;
  const night=mode==="night";
  scene.background=night?(nightSky.clone()):(dayBannerTexture||dayFallback.clone());
  scene.backgroundIntensity=night?.72:.66;
  scene.environmentIntensity=night?.18:.85;
  scene.fog.color.set(night?0x030711:0x0a0d12);
  sun.intensity=night?.22:2.15;
  fill.intensity=night?.07:.38;
  rim.intensity=night?.14:.28;
  stars.material.opacity=night?.92:0;
  nightLights.forEach(({p,intensity})=>p.intensity=night?intensity:0);
  document.getElementById("timeBtn").textContent=night?"切換至日景 · DAY":"切換至夜景 · NIGHT";
}
document.getElementById("timeBtn").onclick=()=>applyTimeMode(timeMode==="day"?"night":"day");
addEventListener("keydown",e=>{if(e.code==="KeyN")applyTimeMode(timeMode==="day"?"night":"day")});

// ---------- CONTROLS ----------
let yaw=0,pitch=0,drag=false,lastX=0,lastY=0,locked=false;
const keys=Object.create(null);
const canvas=renderer.domElement;
canvas.tabIndex=0;
canvas.addEventListener("click",()=>{
  if(renderer.xr.isPresenting)return;
  if(document.pointerLockElement!==canvas) canvas.requestPointerLock?.();
  const f=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  let best=null,bd=99;
  for(const h of hotspots){
    const d=camera.position.distanceTo(h.p);
    if(d<8){
      const t=h.p.clone().sub(camera.position).normalize();
      if(t.dot(f)>.55&&d<bd){best=h;bd=d;}
    }
  }
  if(best){
    const el=document.getElementById("info");
    el.innerHTML="<strong>"+best.title+"</strong><br>"+best.text;
    el.style.display="block";
    clearTimeout(window.__info);
    window.__info=setTimeout(()=>el.style.display="none",4500);
  }
});
document.addEventListener("pointerlockchange",()=>{
  locked=document.pointerLockElement===canvas;
  canvas.style.cursor=locked?"none":"crosshair";
});
document.addEventListener("mousemove",e=>{
  if(renderer.xr.isPresenting)return;
  if(locked){
    yaw-=e.movementX*.0025;pitch-=e.movementY*.002;
  }else if(drag){
    yaw-=(e.clientX-lastX)*.003;pitch-=(e.clientY-lastY)*.002;
  }
  pitch=Math.max(-1.2,Math.min(1.2,pitch));
  lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener("mousedown",e=>{drag=true;lastX=e.clientX;lastY=e.clientY});
document.addEventListener("mouseup",()=>drag=false);
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","ShiftLeft","ShiftRight"].includes(e.code))e.preventDefault();
});
addEventListener("keyup",e=>{keys[e.code]=false});

// ---------- VR ----------
document.getElementById("enter").onclick=()=>{
  if(renderer.xr.isPresenting)return;
  const b=VRButton.createButton(renderer);
  b.style.position="fixed";b.style.bottom="48px";b.style.left="50%";b.style.transform="translateX(-50%)";b.style.zIndex="50";
  document.body.appendChild(b);b.click();
};

const clock=new THREE.Clock();
function animate(){
  const dt=Math.min(clock.getDelta(),.05);
  // automatic door: open only as the visitor approaches from the exterior or lobby.
  const dz=Math.abs(camera.position.z-8.31),dx=Math.abs(camera.position.x);
  const detected=dz<6.0&&dx<6.6;
  for(const d of entranceDoors){
    const target=d.userData.closedX+(detected?d.userData.side*3.05:0);
    d.position.x+=THREE.MathUtils.clamp(target-d.position.x,-3.8*dt,3.8*dt);
  }
  if(!renderer.xr.isPresenting){
    const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
    const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
    const sp=(keys.ShiftLeft||keys.ShiftRight?6.1:3.0)*dt;
    let dxMove=0,dzMove=0;
    if(keys.KeyW||keys.ArrowUp){dxMove+=-f.x*sp;dzMove+=-f.z*sp}
    if(keys.KeyS||keys.ArrowDown){dxMove+=f.x*sp;dzMove+=f.z*sp}
    if(keys.KeyA||keys.ArrowLeft){dxMove+=-r.x*sp;dzMove+=-r.z*sp}
    if(keys.KeyD||keys.ArrowRight){dxMove+=r.x*sp;dzMove+=r.z*sp}
    moveWithCollision(dxMove,dzMove);
    const yTarget=floorHeight(camera.position.x,camera.position.z)+1.7;
    camera.position.y+=(yTarget-camera.position.y)*Math.min(1,dt*12);
    camera.position.x=Math.max(-37,Math.min(37,camera.position.x));
    camera.position.z=Math.max(-72,Math.min(38,camera.position.z));
    camera.rotation.set(pitch,yaw,0,"YXZ");
  }
  // LED façade animation
  const t=performance.now()*.001;
  scene.traverse(o=>{
    if(o.userData?.led&&o.material?.color){
      const v=.08+.14*(.5+.5*Math.sin(t*1.2+o.position.x*3+o.position.y));
      o.material.color.setHSL(.56,.25,v);
    }
  });
  renderer.render(scene,camera);
}
applyTimeMode("day");
renderer.setAnimationLoop(animate);
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
