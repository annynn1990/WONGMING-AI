<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>黃名歷史博物館｜Wongming Museum of History</title>
<style>
:root{
  --paper:#e9e1cf;
  --gold:#d2b06a;
  --gold2:#f0d99e;
  --ink:#172027;
  --glass:rgba(9,14,18,.78);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:var(--paper);font-family:Inter,"Noto Sans TC","Noto Serif TC",sans-serif}
body{touch-action:none}
canvas{display:block;position:fixed;inset:0}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.brand{position:absolute;left:28px;top:24px;text-shadow:0 4px 24px #0008}
.brand h1{margin:0;font:700 27px/1.1 "Noto Serif TC",serif;letter-spacing:.12em}
.brand p{margin:8px 0 0;font-size:9px;letter-spacing:.22em;color:#c3c9cf}
.card{position:absolute;right:24px;top:22px;width:310px;padding:17px 18px 16px;background:linear-gradient(180deg,#0f171eea,#080d12dc);border:1px solid #fff2;box-shadow:0 22px 80px #0009;backdrop-filter:blur(16px);pointer-events:auto}
.kicker{font-size:9px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}
.card h2{margin:7px 0 8px;font:600 18px/1.3 "Noto Serif TC",serif}
.card p{margin:0;color:#b9c0c6;font-size:12px;line-height:1.75}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
button{height:39px;border:1px solid #b89655;background:#171a1c;color:#ead8a7;cursor:pointer;font-size:11px;letter-spacing:.12em}
button:hover{background:#24282b}
#hint{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);padding:9px 13px;background:#071017d9;border:1px solid #fff2;color:#b8c0c7;font-size:10px;white-space:nowrap;backdrop-filter:blur(12px)}
#status{position:absolute;left:24px;bottom:20px;font-size:10px;color:#d3c39d;letter-spacing:.08em;text-shadow:0 2px 10px #000}
#info{display:none;position:absolute;left:50%;bottom:73px;transform:translateX(-50%);max-width:min(600px,88vw);padding:14px 18px;background:#070c11f2;border:1px solid #fff2;box-shadow:0 20px 60px #000a;line-height:1.7;font-size:12px;text-align:left;pointer-events:auto}
#info strong{color:#efd79d;font-size:14px}
#reticle{position:absolute;left:50%;top:50%;width:6px;height:6px;border:1px solid #ebd69b;border-radius:50%;margin:-3px;box-shadow:0 0 12px #000;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#05090df6;transition:opacity .35s}
#loading.off{opacity:0;pointer-events:none}
.loadbox{text-align:center}
.loadbox .seal{font-size:28px;letter-spacing:.2em;color:#d7bb78}
.loadbox p{margin:12px 0 0;color:#9fa8ae;font-size:11px;letter-spacing:.12em}
@media(max-width:760px){
 .card{right:10px;top:10px;width:min(260px,calc(100vw - 20px))}
 .brand{left:12px;top:12px}
 .brand h1{font-size:20px}
 #hint{display:none}
 #status{left:12px;bottom:12px}
}
</style>
</head>
<body>
<div id="hud">
  <div class="brand">
    <h1>黃名歷史博物館</h1>
    <p>WONGMING MUSEUM OF HISTORY</p>
  </div>
  <div class="card">
    <div class="kicker">WMMOH · ARCHITECTURE</div>
    <h2>黃名帝國歷史博物館</h2>
    <p>全新雙層可步行版本。中央入口、中央主燈、挑高大廳、二樓展廳與戶外草坪全部重新建立，避免沿用舊版的碰撞與入口結構。</p>
    <div class="row">
      <button id="dayBtn">切換夜景</button>
      <button id="resetBtn">回到入口</button>
    </div>
  </div>
  <div id="hint">WASD 移動・Shift 加速・滑鼠拖曳轉向・N 日夜・點擊展區查看介紹</div>
  <div id="status">位置：入口廣場　｜　樓層：GROUND</div>
  <div id="info"></div>
  <div id="reticle"></div>
  <div id="loading"><div class="loadbox"><div class="seal">黃名歷史博物館</div><p>BUILDING THE NEW MUSEUM…</p></div></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb3c2);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, .05, 260);
const START = {x:0,y:1.72,z:34,yaw:0,pitch:0};

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();
const temp = new THREE.Vector3();

const mats = {
  asphalt: new THREE.MeshStandardMaterial({color:0x333940,roughness:.95}),
  grass: new THREE.MeshStandardMaterial({color:0x5d7c48,roughness:1}),
  concrete: new THREE.MeshStandardMaterial({color:0xb1b0a9,roughness:.8}),
  concreteDark: new THREE.MeshStandardMaterial({color:0x424951,roughness:.86}),
  stone: new THREE.MeshStandardMaterial({color:0x7e7469,roughness:.75}),
  charcoal: new THREE.MeshStandardMaterial({color:0x1b2229,roughness:.78}),
  black: new THREE.MeshStandardMaterial({color:0x0f1419,roughness:.82}),
  wood: new THREE.MeshStandardMaterial({color:0x4e4035,roughness:.8}),
  gold: new THREE.MeshStandardMaterial({color:0xc8a45a,metalness:.72,roughness:.24}),
  white: new THREE.MeshStandardMaterial({color:0xe8e4da,roughness:.64}),
  wall: new THREE.MeshStandardMaterial({color:0x777a78,roughness:.86}),
  red: new THREE.MeshStandardMaterial({color:0x731c22,roughness:.76}),
  glass: new THREE.MeshPhysicalMaterial({color:0x90abbc,roughness:.10,transmission:.35,transparent:true,opacity:.34,side:THREE.DoubleSide}),
  water: new THREE.MeshPhysicalMaterial({color:0x2a475c,roughness:.08,transmission:.35,transparent:true,opacity:.76}),
  light: new THREE.MeshBasicMaterial({color:0xf2d287})
};

const hemi = new THREE.HemisphereLight(0xbdd1df,0x231d17,1.15);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffdfaf,2.2);
sun.position.set(-35,48,34);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-80; sun.shadow.camera.right=80;
sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80;
sun.shadow.camera.near=1; sun.shadow.camera.far=180;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x8ea9c7,.35);
fill.position.set(38,18,-30);
scene.add(fill);

const museumLights = [];
const lightObjects = [];

function box(w,h,d,x,y,z,m,cast=true,receive=true){
  const o = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z);
  o.castShadow=cast; o.receiveShadow=receive;
  scene.add(o);
  return o;
}
function cyl(r,h,x,y,z,m,segments=24){
  const o = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),m);
  o.position.set(x,y,z);
  o.castShadow=true; o.receiveShadow=true;
  scene.add(o);
  return o;
}
function plane(w,d,x,y,z,m,rotX=-Math.PI/2){
  const o = new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
  o.position.set(x,y,z); o.rotation.x=rotX;
  o.receiveShadow=true;
  scene.add(o);
  return o;
}
function textTexture(lines, width=1200, height=300, accent="#e6d19a"){
  const c=document.createElement("canvas"); c.width=width; c.height=height;
  const g=c.getContext("2d");
  g.fillStyle="#11161b"; g.fillRect(0,0,width,height);
  g.strokeStyle="#b99759"; g.lineWidth=8; g.strokeRect(18,18,width-36,height-36);
  g.textAlign="center";
  g.fillStyle=accent; g.font='700 54px "Noto Sans TC","Microsoft JhengHei",sans-serif';
  g.fillText(lines[0],width/2,116);
  g.fillStyle="#c3c8cb"; g.font="20px Arial,sans-serif";
  if(lines[1]) g.fillText(lines[1],width/2,163);
  if(lines[2]) g.fillText(lines[2],width/2,205);
  return new THREE.CanvasTexture(c);
}
function plaque(title, sub, x,y,z, rotY=0, scale=1){
  const tex=textTexture([title,sub||"", "WONGMING MUSEUM"]);
  const m=new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide});
  const o=new THREE.Mesh(new THREE.PlaneGeometry(3.8*scale,.95*scale),m);
  o.position.set(x,y,z); o.rotation.y=rotY; scene.add(o);
  return o;
}

// ---------- outdoor campus ----------
plane(132,118,0,-.06,-18,mats.grass);
plane(90,18,0,-.01,43,mats.asphalt);

const reflectingPool=box(56,.18,9,0,.12,-46,mats.water,false);
box(58,.25,10,0,.02,-46,mats.stone,false);

for(let x=-40;x<=40;x+=10){
  cyl(.42,.35,x,.12,25,mats.gold,20);
  cyl(.12,2.6,x,1.4,25,mats.concreteDark,20);
  cyl(.75,.18,x,2.72,25,mats.gold,20);
}

// ---------- building shell ----------
const buildingW=64;
const buildingD=46;
const frontZ=10;
const rearZ=-36;

box(64,.75,46,0,2.65,-13,mats.charcoal);
box(64,.55,46,0,7.25,-13,mats.black);

// upper tower, set back from the entrance so the entrance reads as a separate element
box(22,27,20,2,21,-8,mats.charcoal);
box(24,.8,22,2,35,-8,mats.black);
box(24,.55,22,2,8.8,-8,mats.stone);

// vertical fins
const finMat = new THREE.MeshStandardMaterial({color:0x746b63,roughness:.62,metalness:.08});
for(let z=-28;z<=4;z+=3.0){
  for(let x=-29;x<=29;x+=.8){
    box(.16,3.05,.30,x,8.8,z,finMat,true,true);
  }
}
for(let z=-28;z<=3;z+=3.0){
  for(let x=-9.2;x<=13.2;x+=.46){
    box(.13,24,.32,x,21,z,finMat,true,false);
  }
}

// front glazing sections leave a generous true doorway in the middle
box(22,7.1,.30,-21,4.55,10.55,mats.glass,false,false);
box(22,7.1,.30,21,4.55,10.55,mats.glass,false,false);

// ---------- true entrance ----------
for(let i=0;i<6;i++){
  const width=20-i*1.1;
  box(width,.28,1.15,0,.14+i*.29,15.4-i*1.0,mats.concrete,false,true);
}
plane(6.4,16,0,.31,20.1,mats.red);

box(24,.7,8.2,0,8.55,13.1,mats.black);
box(18,.16,7.25,0,8.16,10.65,mats.gold);

box(1.0,8.0,1.25,-9.1,4.45,10.72,mats.concrete);
box(1.0,8.0,1.25,9.1,4.45,10.72,mats.concrete);

// glass doors + header
const doors=[
  {mesh:box(3.2,6.7,.16,-1.62,3.72,10.45,mats.glass,false,false),side:-1,closed:-1.62},
  {mesh:box(3.2,6.7,.16,1.62,3.72,10.45,mats.glass,false,false),side:1,closed:1.62}
];
box(13.8,.18,.22,0,7.2,10.38,mats.gold,false,false);

const entranceLamp = new THREE.PointLight(0xffd58a,75,24,1.8);
entranceLamp.position.set(0,6.2,8.6);
scene.add(entranceLamp); museumLights.push(entranceLamp);

for(const x of [-6.6,0,6.6]){
  const l=new THREE.PointLight(0xffc777,18,15,1.8);
  l.position.set(x,5.1,8.8);
  scene.add(l); museumLights.push(l);
}

const marqueeMat=new THREE.MeshBasicMaterial({
  map:textTexture(["帝國歷史博物館","WONGMING MUSEUM OF HISTORY","WMMOH"]),
  side:THREE.DoubleSide
});
const marquee=new THREE.Mesh(new THREE.PlaneGeometry(16,3.2),marqueeMat);
marquee.position.set(0,6.05,10.02);
scene.add(marquee);

plaque("黃名歷史博物館","MAIN ENTRANCE",0,7.15,9.98,0,1.05);

// ---------- central atrium ----------
box(18,.22,25,0,.72,-12,mats.white,false,true);
box(17,.16,21,0,7.65,-12,mats.glass,false,false);

// atrium vertical fins
for(let x=-7.5;x<=7.5;x+=2.5){
  box(.10,7,.10,x,4.2,-12,mats.gold,false,false);
}

// ---------- grand stair ----------
const stair={x:0,startZ:8.0,run:16,rise:5.8,steps:24};
for(let i=0;i<stair.steps;i++){
  const z=stair.startZ-(i+1)*(stair.run/stair.steps);
  const y=.76+(i+1)*(stair.rise/stair.steps);
  const w=6.6;
  box(w,stair.rise/stair.steps,stair.run/stair.steps,stair.x,y-(stair.rise/stair.steps)/2,z,mats.concrete,false,true);
}
for(const side of [-1,1]){
  const x=side*3.45;
  box(.12,1.05,17,x,3.45,0,mats.gold,false,false,[0,0,-Math.atan2(stair.rise,stair.run)]);
}
plaque("LEVEL 2 · 展廳","MAIN GALLERY FLOOR",0,7.0,-8.3,Math.PI,1.0);

// ---------- ground-floor galleries ----------
const groundRooms=[
  {name:"帝國起源廳",sub:"WONGMING ORIGINS",x:-18,z:-5},
  {name:"歷史沿革廳",sub:"HISTORY OF THE EMPIRE",x:18,z:-5},
  {name:"宮廷文物廳",sub:"COURT & ARTIFACTS",x:-18,z:-19},
  {name:"微國歷史廳",sub:"MICRONATION HISTORY",x:18,z:-19}
];

function makeGroundGallery(r){
  const w=20,d=10,h=3.1;
  box(w,.18,d,r.x,.75,r.z,mats.white,false,true);
  box(w,h,.20,r.x,2.3,r.z-d/2,mats.white);
  box(.20,h,d,r.x-w/2,2.3,r.z,mats.white);
  box(.20,h,d,r.x+w/2,2.3,r.z,mats.white);
  // back wall deliberately contains a wide opening, so the space feels like a gallery not a closed box
  box(5.4,h,.20,r.x-w/2+3.0,2.3,r.z+d/2,mats.white);
  box(5.4,h,.20,r.x+w/2-3.0,2.3,r.z+d/2,mats.white);
  plaque(r.name,r.sub,r.x,2.85,r.z-d/2-.04,0,1);
  for(const px of [r.x-5.8,r.x,r.x+5.8]){
    box(3.5,1.55,.10,px,1.72,r.z-d/2-.08,mats.gold,false,false);
    box(3.15,1.35,.05,px,1.72,r.z-d/2-.15,mats.black,false,false);
  }
  for(const px of [r.x-5,r.x+5]){
    const l=new THREE.PointLight(0xffe1ab,7,8,2);
    l.position.set(px,3.2,r.z);
    scene.add(l); museumLights.push(l);
  }
}
groundRooms.forEach(makeGroundGallery);

// center ground orientation plaque
plaque("中央大堂","CENTRAL ATRIUM",0,3.1,1.8,0,1.05);

// ---------- second floor plan ----------
const upperY=6.55;
// side wings
box(18,.20,34,-17.5,upperY,-14.0,mats.white,false,true);
box(18,.20,34,17.5,upperY,-14.0,mats.white,false,true);
// front and rear bridges
box(16,.20,5,0,upperY,3.0,mats.white,false,true);
box(16,.20,5,0,upperY,-31.0,mats.white,false,true);

// balustrade around atrium
box(.10,1.1,27,-8.2,upperY+.56,-13.8,mats.gold,false,false);
box(.10,1.1,27,8.2,upperY+.56,-13.8,mats.gold,false,false);
for(let z=-27;z<=0;z+=2.7){
  box(.06,.95,.06,-8.2,upperY+.46,z,mats.gold,false,false);
  box(.06,.95,.06,8.2,upperY+.46,z,mats.gold,false,false);
}

// ten exhibition rooms, five per side
const upperRooms=[
  ["紀念人物廳","MEMORIALS"],["黃名政治廳","GOVERNMENT"],["黃名文化廳","CULTURE"],
  ["黃名軍事廳","DEFENCE"],["帝國人物廳","PERSONALITIES"],
  ["微國制度廳","MICRONATION SYSTEMS"],["微國外交廳","DIPLOMACY"],["微國文化廳","MICRONATION CULTURE"],
  ["微國文物廳","MICRONATION ARTIFACTS"],["未來展望廳","FUTURE EXHIBITION"]
];
const rows=[-2,-8.5,-15,-21.5,-28];

function makeUpperRoom(title,sub,x,z,side){
  const w=15.2,d=5.2,h=2.8, y=upperY+.14;
  box(w,.16,d,x,y-.07,z,mats.white,false,true);
  box(w,.24,.18,x,y+h/2,z-d/2,mats.white);
  box(.18,h,d,x+side*(w/2),y+h/2,z,mats.white);
  box(.18,h,d,x-side*(w/2),y+h/2,z,mats.white);
  // open corridor side with short return walls
  box(4.0,h,.18,x-side*(w/2)+side*2.0,y+h/2,z+d/2,mats.white);
  box(4.0,h,.18,x+side*(w/2)-side*2.0,y+h/2,z+d/2,mats.white);
  plaque(title,sub,x,y+h-.15,z-d/2-.06,0,.78);
  box(3.6,1.45,.08,x-4.1,y+1.16,z-d/2-.10,mats.black,false,false);
  box(3.6,1.45,.08,x+4.1,y+1.16,z-d/2-.10,mats.black,false,false);
  box(3.0,1.10,.08,x,y+.88,z+d/2-.05,mats.gold,false,false);
  const l=new THREE.PointLight(0xffdca4,6,7,2);
  l.position.set(x,y+2.5,z);
  scene.add(l); museumLights.push(l);
}
for(let i=0;i<5;i++){
  makeUpperRoom(upperRooms[i][0],upperRooms[i][1],-18,rows[i],-1);
  makeUpperRoom(upperRooms[i+5][0],upperRooms[i+5][1],18,rows[i],1);
}

// upper directional signage
plaque("二樓歷史展廳","HISTORY GALLERIES",0,7.55,1.8,Math.PI,1.0);

// ---------- roof garden ----------
plane(54,34,0,10.05,-15,mats.grass);
box(56,.8,1.0,0,10.5,2,mats.black);
box(56,.8,1.0,0,10.5,-32,mats.black);
box(1,.8,34,-27,10.5,-15,mats.black);
box(1,.8,34,27,10.5,-15,mats.black);

for(let x=-20;x<=20;x+=8){
  for(let z=-28;z<=-4;z+=8){
    cyl(.38,.9,x,10.65,z,mats.wood,18);
    cyl(.72,.6,x,11.32,z,mats.grass,18);
  }
}
plaque("屋頂公共花園","PUBLIC ROOF GARDEN",0,12.0,-31.3,Math.PI,.92);

// ---------- exhibition markers ----------
const hotspots=[
  {p:new THREE.Vector3(-18,1.4,-5),title:"帝國起源廳",text:"黃名帝國歷史起源與早期發展。"},
  {p:new THREE.Vector3(18,1.4,-5),title:"歷史沿革廳",text:"黃名帝國主要歷史階段與制度變遷。"},
  {p:new THREE.Vector3(-18,1.4,-19),title:"宮廷文物廳",text:"宮廷文化、典禮與歷史文物。"},
  {p:new THREE.Vector3(18,1.4,-19),title:"微國歷史廳",text:"世界微型國家與相關歷史脈絡。"},
  {p:new THREE.Vector3(-18,8.1,-2),title:"紀念人物廳",text:"黃名帝國重要人物與紀念資料。"},
  {p:new THREE.Vector3(18,8.1,-2),title:"微國制度廳",text:"微型國家的制度與治理形式。"}
];
for(const h of hotspots){
  const ring=new THREE.Mesh(new THREE.RingGeometry(.62,.76,32),mats.gold);
  ring.rotation.x=-Math.PI/2; ring.position.set(h.p.x,.10,h.p.z);
  ring.userData.hotspot=h; scene.add(ring);
}

// ---------- central ceiling lamp, isolated and robust ----------
const lampGroup=new THREE.Group();
lampGroup.position.set(0,6.0,0.4);
scene.add(lampGroup);

function addProceduralMainLamp(){
  const plate=new THREE.Mesh(new THREE.CylinderGeometry(2.15,.75,.22,64),mats.gold);
  plate.position.y=0; lampGroup.add(plate);
  for(let i=0;i<7;i++){
    const a=(i/7)*Math.PI*2;
    const x=Math.cos(a)*1.55,z=Math.sin(a)*1.55;
    const ring=new THREE.Mesh(new THREE.CylinderGeometry(.34,.42,.12,32),mats.light);
    ring.position.set(x,-.12,z); lampGroup.add(ring);
    const l=new THREE.PointLight(0xffd88f,7,9,1.8);
    l.position.set(x,-.35,z); lampGroup.add(l); lightObjects.push(l);
  }
  const center=new THREE.Mesh(new THREE.SphereGeometry(.65,32,20),new THREE.MeshStandardMaterial({color:0xe8cb82,emissive:0x6c521d,emissiveIntensity:1.1,metalness:.35,roughness:.24}));
  center.position.y=-.15; lampGroup.add(center);
}
addProceduralMainLamp();

// Optional supplied GLB: use it only as the decorative shell; the light system remains functional if the asset fails.
new GLTFLoader().load(
  "https://raw.githubusercontent.com/annynn1990/wk/main/assets/750221_and_750223_favo_lightstar_ceiling_lamp.glb",
  gltf=>{
    const lamp=gltf.scene;
    const bb=new THREE.Box3().setFromObject(lamp);
    const size=bb.getSize(new THREE.Vector3());
    const maxDim=Math.max(size.x,size.y,size.z);
    if(maxDim>0) lamp.scale.setScalar(3.1/maxDim);
    const b2=new THREE.Box3().setFromObject(lamp);
    const c=b2.getCenter(new THREE.Vector3());
    lamp.position.sub(c);
    lamp.position.y=.2;
    lamp.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
    lampGroup.add(lamp);
  },
  undefined,
  ()=>{}
);

// ---------- navigation ----------
camera.position.set(START.x,START.y,START.z);
let yaw=0, pitch=0;
const keys=Object.create(null);
let dragging=false, lastX=0,lastY=0;
let night=false;

function resetView(){
  camera.position.set(START.x,START.y,START.z);
  yaw=0; pitch=0;
}
function insideBuilding(x,z){
  return x>-31 && x<31 && z>-34 && z<10;
}
function upperWalkable(x,z){
  if(x>-9 && x<9 && z>-29 && z<4) return false;
  return x>-28 && x<28 && z>-32 && z<5;
}
function stairProgress(x,z){
  if(Math.abs(x)>3.7 || z>8 || z<-8) return -1;
  const p=(8-z)/16;
  return THREE.MathUtils.clamp(p,0,1);
}
function floorHeight(x,z){
  const p=stairProgress(x,z);
  if(p>=0 && p<=1) return .76+p*5.75;
  // second floor
  if(upperWalkable(x,z) && camera.position.y>4.7) return upperY;
  return .76;
}
function canStand(x,z){
  if(x<-44||x>44||z<-49||z>39) return false;
  if(z<-34 && x>-31 && x<31) return true;
  if(insideBuilding(x,z)){
    const p=stairProgress(x,z);
    if(p>=0) return true;
    if(camera.position.y>4.5) return upperWalkable(x,z);
    return z<9.6;
  }
  return true;
}
function move(dx,dz){
  const nx=camera.position.x+dx;
  const nz=camera.position.z+dz;
  if(canStand(nx,camera.position.z)) camera.position.x=nx;
  if(canStand(camera.position.x,nz)) camera.position.z=nz;
}

renderer.domElement.tabIndex=0;
renderer.domElement.addEventListener("mousedown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
addEventListener("mouseup",()=>dragging=false);
addEventListener("mousemove",e=>{
  if(!dragging) return;
  yaw-=(e.clientX-lastX)*.003;
  pitch-=(e.clientY-lastY)*.002;
  pitch=THREE.MathUtils.clamp(pitch,-1.18,1.18);
  lastX=e.clientX; lastY=e.clientY;
});
renderer.domElement.addEventListener("click",()=>{
  const forward=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch,yaw,0,"YXZ"));
  let best=null, bestD=9;
  for(const h of hotspots){
    const d=camera.position.distanceTo(h.p);
    if(d>9) continue;
    const dir=h.p.clone().sub(camera.position).normalize();
    if(dir.dot(forward)>.35 && d<bestD){best=h;bestD=d;}
  }
  const info=document.getElementById("info");
  if(best){
    info.innerHTML="<strong>"+best.title+"</strong><br>"+best.text;
    info.style.display="block";
    clearTimeout(window.__infoTimer);
    window.__infoTimer=setTimeout(()=>info.style.display="none",4500);
  }
});

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyN") toggleNight();
});
addEventListener("keyup",e=>keys[e.code]=false);

function applyNight(){
  const n=night;
  scene.background=new THREE.Color(n?0x03070d:0x9fb3c2);
  hemi.intensity=n?.42:1.15;
  sun.intensity=n?.25:2.2;
  fill.intensity=n?.10:.35;
  museumLights.forEach(l=>{ l.intensity = n ? Math.max(6,l.userData.dayIntensity||l.intensity) : (l.userData.dayIntensity||Math.max(3,l.intensity)) });
  lightObjects.forEach(l=>l.intensity=n?10:7);
  document.getElementById("dayBtn").textContent=n?"切換日景":"切換夜景";
}
museumLights.forEach(l=>l.userData.dayIntensity=l.intensity);
function toggleNight(){night=!night;applyNight()}

// initial daytime state
applyNight();

document.getElementById("dayBtn").onclick=toggleNight;
document.getElementById("resetBtn").onclick=resetView;

// camera update
function updateCamera(dt){
  const speed=(keys.ShiftLeft||keys.ShiftRight)?7.0:3.5;
  const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw));
  const r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let dx=0,dz=0;
  if(keys.KeyW||keys.ArrowUp){dx+=-f.x*speed*dt;dz+=-f.z*speed*dt}
  if(keys.KeyS||keys.ArrowDown){dx+=f.x*speed*dt;dz+=f.z*speed*dt}
  if(keys.KeyA||keys.ArrowLeft){dx+=-r.x*speed*dt;dz+=-r.z*speed*dt}
  if(keys.KeyD||keys.ArrowRight){dx+=r.x*speed*dt;dz+=r.z*speed*dt}
  move(dx,dz);
  const targetY=floorHeight(camera.position.x,camera.position.z)+1.68;
  camera.position.y += (targetY-camera.position.y)*Math.min(1,dt*9);
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

// update doors and UI
function updateEntrance(dt){
  const near=Math.abs(camera.position.z-10.4)<8.5 && Math.abs(camera.position.x)<8.5;
  for(const d of doors){
    const target=d.closed+(near?d.side*3.25:0);
    d.mesh.position.x += THREE.MathUtils.clamp(target-d.mesh.position.x,-5*dt,5*dt);
  }
}
function updateStatus(){
  const y=camera.position.y;
  const floor=y>7.5?"LEVEL 2": "GROUND";
  let place="入口廣場";
  if(camera.position.z<9 && camera.position.z>-34) place="館內";
  if(camera.position.z<-35) place="戶外水景";
  document.getElementById("status").textContent="位置："+place+"　｜　樓層："+floor;
}

function animate(){
  const dt=Math.min(clock.getDelta(),.045);
  updateEntrance(dt);
  updateCamera(dt);

  lampGroup.rotation.y += dt*.08;
  const pulse=.88+.12*Math.sin(performance.now()*.0027);
  lampGroup.children.forEach(o=>{
    if(o.material && o.material===mats.light) o.scale.setScalar(pulse);
  });

  updateStatus();
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

window.addEventListener("load",()=>setTimeout(()=>document.getElementById("loading").classList.add("off"),350));
</script>
</body>
</html>
