  const lunarInfo = [

    0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,

    0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,
    0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,
    0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,
    0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,
    0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,
    0x0d530,0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,
    0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,
    0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,
    0x0aae0,0x092e0,0x0d2e3,0x0c960,0x0d550,0x0d559,0x0b540,0x0b5a0,0x195a6,0x095b0,

    0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,0x0c960,
    0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,
    0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,
    0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,
    0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,
    0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0
  ];

  function leapMonth(y){return lunarInfo[y-1900]&0xf;}
  function leapDays(y){return leapMonth(y)?((lunarInfo[y-1900]&0x10000)?30:29):0;}
  function monthDays(y,m){return(lunarInfo[y-1900]&(0x10000>>m))?30:29;}
  function yearDays(y){
    let s=348;
    for(let mask=0x8000;mask>0x8;mask>>=1)if(lunarInfo[y-1900]&mask)s++;
    return s+leapDays(y);
  }
  function lunarToSolar(y,m,d){
    if(y<1900||y>2100)return null;
    const base=new Date(1900,0,31);let offset=0;
    for(let yy=1900;yy<y;yy++)offset+=yearDays(yy);
    const leap=leapMonth(y);
    for(let mm=1;mm<m;mm++){
      offset+=monthDays(y,mm);
      if(leap===mm)offset+=leapDays(y);
    }
    offset+=d-1;
    const out=new Date(base);out.setDate(out.getDate()+offset);return out;
  }
  function qingming(y){
    const ex={2008:4,2012:4,2015:5,2016:4,2019:5,2020:4,2021:4,2024:4,2025:4,2026:5,2027:5,2028:4,2029:4,2030:5,2031:5,2032:4,2033:4,2034:5,2035:5,2036:4,2037:5,2038:4,2039:5,2040:4,2041:4,2042:5,2043:5,2044:4,2045:4,2046:5,2047:5,2048:4,2049:4,2050:5};
    if(ex[y])return new Date(y,3,ex[y]);
    const yy=y%100,dd=Math.floor(yy*0.2422+4.81)-Math.floor(yy/4);
    return new Date(y,3,dd);
  }
  const now=new Date(), year=now.getFullYear(), month=now.getMonth()+1, day=now.getDate();
  const holidays=[];
  const addFixed=(m,d,name)=>holidays.push({name,date:new Date(year,m-1,d)});
  const addLunar=(m,d,name)=>{const x=lunarToSolar(year,m,d);if(x)holidays.push({name,date:x});};
  const addRangeLunar=(m,d1,d2,name)=>{const s=lunarToSolar(year,m,d1),e=lunarToSolar(year,m,d2);if(s&&e)holidays.push({name,startDate:s,endDate:e,date:s});};

  addFixed(1,1,'元旦');
  addFixed(1,8,'廣播紀念日');
  addFixed(4,26,'外務日');
  addFixed(5,5,'府尹紀念日');
  addFixed(5,23,'五二三紀念日');
  addFixed(6,1,'即位日');
  addFixed(7,11,'仲夏改革紀念日');
  addFixed(7,20,'太平節');
  addFixed(8,26,'國慶日');
  addFixed(9,30,'皇壽日');
  addFixed(10,17,'黃統紀念日');
  addFixed(10,20,'復興日');
  addFixed(11,1,'國會紀念日');
  addFixed(11,10,'宗教崇敬日');
  addFixed(12,25,'聖誕節');

  const spring=lunarToSolar(year,1,1);
  if(spring){
    holidays.push({name:'春節',date:spring});
    const open=new Date(spring);open.setDate(open.getDate()+1);holidays.push({name:'開年日',date:open});
    const chi=new Date(spring);chi.setDate(chi.getDate()+2);holidays.push({name:'赤口',date:chi});
  }
  addLunar(1,15,'元宵');
  const qm=qingming(year);holidays.push({name:'清明節',date:qm});
  const qh=new Date(qm);qh.setDate(qh.getDate()+1);holidays.push({name:'慶和節',date:qh});
  addRangeLunar(7,14,16,'盂蘭典祭');
  addLunar(8,15,'中秋節');

  const today=[];
  holidays.forEach(function(h){
    const s=h.startDate||h.date,e=h.endDate||h.date;
    if(new Date(year,month-1,day)>=s&&new Date(year,month-1,day)<=e)
      today.push({name:h.name,date:String((h.date||s).getMonth()+1).padStart(2,'0')+'/'+String((h.date||s).getDate()).padStart(2,'0')});
  });

  const data={
    source:'wongming-ai/holiday-source',
    date:year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0'),
    today:today,
    holidays:holidays.map(function(h){return{name:h.name,date:String((h.date||h.startDate).getMonth()+1).padStart(2,'0')+'/'+String((h.date||h.startDate).getDate()).padStart(2,'0')};})
  };
  data.greeting=today.length?'今天是「'+today.map(x=>x.name).join('、')+'」，祝您節日愉快！':'';

  try { window.parent.postMessage({ns:'wongming-holiday',type:'holiday-data',data:data},'https://www.wongmingempire.com'); } catch(e) {}
  try { window.parent.postMessage({ns:'wongming-holiday',type:'holiday-data',data:data},'*'); } catch(e) {}
  window.WM_HOLIDAY_SOURCE=data;
})();
</script>
